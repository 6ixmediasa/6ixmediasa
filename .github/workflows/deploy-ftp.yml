name: Deploy to cPanel via FTPS

on:
  push:
    branches:
      - main
    paths:
      - ".github/ftp-deploy-now.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build static website
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/logo.png
          test -f out/projects/exquisite-management/project.pdf

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify FTPS login
        shell: bash
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; pwd; bye"

      - name: Preserve current AutoSSL challenge files when present
        shell: bash
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          mkdir -p .well-known-preserve
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; mirror public_html/.well-known .well-known-preserve; bye" || true

      - name: Upload site to staging directory
        shell: bash
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE=".6ixmedia-stage-$RUN_ID"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; rm -r -f $STAGE; mkdir $STAGE; mirror -R --parallel=4 out $STAGE; cls -1 $STAGE/index.html; cls -1 $STAGE/logo.png; bye"

      - name: Cut over to new site and retain complete backup
        shell: bash
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE=".6ixmedia-stage-$RUN_ID"
          BACKUP="public_html_backup_before_nextjs_$RUN_ID"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; mv public_html $BACKUP; mv $STAGE public_html; cls -1 public_html/index.html; bye"

      - name: Restore preserved AutoSSL challenge files
        shell: bash
        env:
          FTP_HOST: ${{ secrets.CPANEL_HOST }}
          FTP_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          if [ -n "$(find .well-known-preserve -mindepth 1 -print -quit 2>/dev/null)" ]; then
            lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; mkdir -p public_html/.well-known; mirror -R --parallel=2 .well-known-preserve public_html/.well-known; bye"
          fi

      - name: Verify live site responds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://6ixmediasa.com/ -o /tmp/homepage.html
          test -s /tmp/homepage.html
          echo "Live site responded successfully."
