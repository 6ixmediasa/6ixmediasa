name: cPanel connectivity check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cpanel-connectivity-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe common SSH and FTP ports
        shell: bash
        run: |
          set -u
          HOST="zacp105.webway.host"
          echo "Testing external connectivity to $HOST"
          for PORT in 22 2222 2022 2200 21098 21 990; do
            if timeout 6 bash -c "</dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "OPEN $PORT"
            else
              echo "CLOSED_OR_FILTERED $PORT"
            fi
          done
