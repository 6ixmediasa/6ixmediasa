name: Restore source from uploaded archive

on:
  push:
    branches:
      - source-restore
    paths:
      - ".github/workflows/unpack-source.yml"
      - "github_ready_6ixmediasa.rar"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          7z x github_ready_6ixmediasa.rar -oextracted -y
          SRC="$(find extracted -type f -name package.json -printf '%h\n' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "Could not locate package.json after extraction"
            find extracted -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          echo "Source root: $SRC"
          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            base="$(basename "$item")"
            case "$base" in
              .git|node_modules|.next|out|PUSH_TO_GITHUB.bat|MIGRATION_NOTE.txt) continue ;;
            esac
            cp -a "$item" ./
          done
          rm -rf extracted
          rm -f github_ready_6ixmediasa.rar

      - name: Configure static export for shared hosting
        shell: bash
        run: |
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            trailingSlash: true,
            images: {
              unoptimized: true,
              remotePatterns: [{ protocol: "https", hostname: "**" }],
            },
          };

          export default nextConfig;
          EOF

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "6ixMedia SA Automation"
          git config user.email "91912065+6ixmediasa@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Restore complete Next.js source"
            git push origin HEAD:source-restore
          fi
