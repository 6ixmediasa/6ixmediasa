name: Admin CMS check

on:
  push:
    branches: [admin-cms]
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l public/index.php
          php -l public/api/published.php
          php -l scripts/migrate-content-v3.php
          php -l scripts/seed-existing-content-v3.php
          bash -n scripts/upgrade-admin-v3.sh
          bash -n scripts/deploy-admin.sh
