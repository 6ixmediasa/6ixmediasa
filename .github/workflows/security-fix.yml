name: Patch production dependency vulnerabilities

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe npm audit fixes
        run: npm audit fix

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build static export
        run: npm run build

      - name: Commit dependency fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "6ixMedia SA Automation"
          git config user.email "91912065+6ixmediasa@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
          else
            git commit -m "Patch production dependency vulnerabilities"
            git push origin HEAD:main
          fi
