name: Publish static production branch

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-static-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Fetch published CMS content
        run: node scripts/fetch-cms-content.mjs

      - name: Build static site
        run: npm run build

      - name: Verify output and create deployment marker
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/logo.png
          test -f out/projects/exquisite-management/project.pdf
          test -f out/blog/index.html
          CONTENT_HASH="$(sha256sum lib/cms-content.json | awk '{print $1}')"
          printf '%s-%s\n' "$GITHUB_SHA" "$CONTENT_HASH" > out/.deploy-sha
          touch out/.nojekyll

      - name: Publish production-static branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER="$(cat out/.deploy-sha)"
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Static production build ${MARKER}"
          git branch -M production-static
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production-static
