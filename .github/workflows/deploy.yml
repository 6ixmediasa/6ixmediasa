name: Deploy to cPanel

on:
  push:
    branches:
      - main
    paths:
      - ".github/deploy-now.txt"
  workflow_dispatch:
    inputs:
      confirm_live_deploy:
        description: "Type DEPLOY to confirm deployment to the configured cPanel path"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm_live_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build static website
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/logo.png
          test -f out/projects/exquisite-management/project.pdf
          echo "Static export verified."

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.CPANEL_SSH_PRIVATE_KEY_B64 }}
          SSH_PRIVATE_KEY_RAW: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 - <<'PY'
          import base64
          import os
          import re
          import subprocess
          from pathlib import Path

          target = Path.home() / ".ssh/cpanel_deploy_key"
          candidates = []

          def extract_private_key(text):
              if not text:
                  return None
              text = text.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n")
              patterns = [
                  r"-----BEGIN OPENSSH PRIVATE KEY-----.*?-----END OPENSSH PRIVATE KEY-----",
                  r"-----BEGIN RSA PRIVATE KEY-----.*?-----END RSA PRIVATE KEY-----",
                  r"-----BEGIN PRIVATE KEY-----.*?-----END PRIVATE KEY-----",
              ]
              for pattern in patterns:
                  m = re.search(pattern, text, re.S)
                  if m:
                      return m.group(0).strip() + "\n"
              return None

          raw = os.environ.get("SSH_PRIVATE_KEY_RAW", "")
          raw_key = extract_private_key(raw)
          if raw_key:
              candidates.append(raw_key)

          secret = os.environ.get("SSH_PRIVATE_KEY_B64", "")
          direct_key = extract_private_key(secret)
          if direct_key:
              candidates.append(direct_key)

          if secret:
              attempts = []
              compact = re.sub(r"\s+", "", secret)
              attempts.append(compact)
              prefix = "LS0tLS1CRUdJTi"
              pos = compact.find(prefix)
              if pos > 0:
                  attempts.append(compact[pos:])

              for encoded in attempts:
                  try:
                      decoded = base64.b64decode(encoded, validate=False)
                  except Exception:
                      continue
                  try:
                      decoded_text = decoded.decode("utf-8", errors="ignore")
                  except Exception:
                      continue
                  key = extract_private_key(decoded_text)
                  if key:
                      candidates.append(key)

          seen = set()
          for key in candidates:
              if key in seen:
                  continue
              seen.add(key)
              target.write_text(key)
              target.chmod(0o600)
              result = subprocess.run(["ssh-keygen", "-y", "-f", str(target)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode == 0:
                  print("SSH private key parsed successfully.")
                  break
          else:
              raise SystemExit("No valid unencrypted SSH private key could be parsed from the configured secrets.")
          PY

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH and deployment tools
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; command -v tar >/dev/null; command -v find >/dev/null; command -v cp >/dev/null; mkdir -p '$DEPLOY_PATH'; test -d '$DEPLOY_PATH'; echo 'SSH and deployment tools verified.'"

      - name: Back up current live files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; mkdir -p \"$HOME/deploy-backups\"; if [ -n \"\$(find '$DEPLOY_PATH' -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)\" ]; then stamp=\$(date +%Y%m%d-%H%M%S); tar -czf \"$HOME/deploy-backups/public_html-before-nextjs-$stamp.tar.gz\" -C '$DEPLOY_PATH' .; echo \"Backup created: $HOME/deploy-backups/public_html-before-nextjs-$stamp.tar.gz\"; else echo 'Deploy path is empty; no backup needed.'; fi"

      - name: Upload and stage static website
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE_DIR="$HOME/.6ixmedia-deploy-$RUN_ID"
          ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -rf '$STAGE_DIR' && mkdir -p '$STAGE_DIR'"
          tar -C out -czf - . | ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$STAGE_DIR'"
          ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "test -f '$STAGE_DIR/index.html' && test -f '$STAGE_DIR/logo.png' && echo 'Staged site verified.'"

      - name: Publish staged website
        shell: bash
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE_DIR="$HOME/.6ixmedia-deploy-$RUN_ID"
          ssh -o BatchMode=yes -i ~/.ssh/cpanel_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             test -f '$STAGE_DIR/index.html'; \
             mkdir -p '$DEPLOY_PATH'; \
             find '$DEPLOY_PATH' -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf -- {} +; \
             cp -a '$STAGE_DIR'/.' '$DEPLOY_PATH'/; \
             rm -rf '$STAGE_DIR'; \
             test -f '$DEPLOY_PATH/index.html'; \
             test -f '$DEPLOY_PATH/logo.png'; \
             echo 'Deployment files verified on cPanel.'"

      - name: Verify live site responds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://6ixmediasa.com/ -o /tmp/homepage.html
          test -s /tmp/homepage.html
          echo "Live site responded successfully."
